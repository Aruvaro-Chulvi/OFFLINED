<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <!-- Fondo rojo -->
  <rect width="900" height="600" fill="#DE2910"></rect>

  <!-- Estrella 5 puntas base (unidad) -->
  <defs>
    <!-- estrella centrada en (0,0), punta hacia arriba -->
    <g id="star">
      <polygon fill="#FFDE00" points="
          0,-1
          0.2245139882897309,-0.30901699437486235
          0.9510565162951535,-0.3090169943749474
          0.3632712640026805,0.1180339887498949
          0.5877852522924731,0.8090169943749475
          0,0.3819660112501051
          -0.5877852522924731,0.8090169943749475
          -0.3632712640026805,0.1180339887498949
          -0.9510565162951535,-0.3090169943749474
          -0.2245139882897309,-0.30901699437486235
        "></polygon>
    </g>
  </defs>

  <!-- Sistema de coordenadas oficial: 30×20 unidades (escala 30px) -->
  <!-- Estrella grande: centro (5,5), radio 3 (=> 90px) -->
  <use href="#star" transform="translate(150,150) scale(90)"></use>

  <!-- Cuatro estrellas pequeñas: centro (10,2), (12,4), (12,7), (10,9), radio 1 (=> 30px) -->
  <!-- Cada una rota para que una punta mire hacia el centro de la estrella grande -->
  <!-- Ángulos calculados (grados): 239.036, 261.870, -74.055, -51.340 -->
  <use href="#star" transform="translate(300, 60)  rotate(239.036) scale(30)"></use>
  <use href="#star" transform="translate(360,120) rotate(261.870) scale(30)"></use>
  <use href="#star" transform="translate(360,210) rotate(-74.055) scale(30)"></use>
  <use href="#star" transform="translate(300,270) rotate(-51.340) scale(30)"></use>
</svg>
