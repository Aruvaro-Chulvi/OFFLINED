<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2">
  <!-- Fondo: verde (2/5) y rojo (3/5) -->
  <rect width="1.2" height="2" x="0" y="0" fill="#006600"></rect>
  <rect width="1.8" height="2" x="1.2" y="0" fill="#FF0000"></rect>

  <!-- Grupo del emblema, centrado en la unión (x=1.2, y=1.0) -->
  <g id="emblem" transform="translate(1.2,1)">
    <!-- Armilar dorado (versión minimalista con aros) -->
    <g fill="none" stroke="#FFD700" stroke-width="0.06" stroke-linecap="round">
      <!-- Anillo exterior -->
      <circle r="0.42"></circle>
      <!-- Aro horizontal (elipse) -->
      <ellipse rx="0.42" ry="0.14"></ellipse>
      <!-- Aros inclinados -->
      <ellipse rx="0.42" ry="0.14" transform="rotate(65)"></ellipse>
      <ellipse rx="0.42" ry="0.14" transform="rotate(-65)"></ellipse>
    </g>

    <!-- Escudo simplificado (por encima del armilar) -->
    <!-- Contorno rojo con relleno blanco -->
    <path d="
      M -0.17 -0.20
      H  0.17
      V  0.08
      Q  0.00 0.24 -0.17 0.08
      Z" fill="#FFFFFF" stroke="#C00000" stroke-width="0.05"></path>

    <!-- 'Quinas' azules (5 puntos en cruz sobre el campo blanco) -->
    <g fill="#0047AB">
      <circle cx="-0.06" cy="-0.05" r="0.025"></circle>
      <circle cx=" 0.06" cy="-0.05" r="0.025"></circle>
      <circle cx=" 0.00" cy=" 0.00" r="0.025"></circle>
      <circle cx="-0.06" cy=" 0.05" r="0.025"></circle>
      <circle cx=" 0.06" cy=" 0.05" r="0.025"></circle>
    </g>
  </g>

  <title>Portugal (PT) — minimal</title>
</svg>
