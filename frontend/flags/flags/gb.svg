<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30">
  <rect width="60" height="30" fill="#012169"></rect>
  <!-- Diagonales blancas -->
  <path d="M0,0 L60,30 M60,0 L0,30" stroke="#FFFFFF" stroke-width="6"></path>
  <!-- Diagonales rojas (centradas para simplificar) -->
  <path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="3"></path>
  <!-- Cruz blanca central -->
  <path d="M30,0 V30 M0,15 H60" stroke="#FFFFFF" stroke-width="10"></path>
  <!-- Cruz roja central -->
  <path d="M30,0 V30 M0,15 H60" stroke="#C8102E" stroke-width="6"></path>
  <title>United Kingdom (GB)</title>
</svg>
