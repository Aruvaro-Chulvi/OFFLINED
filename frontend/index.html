<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Survival AI — Offline</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
<header class="app-header">
  <div class="brand">
    <span class="logo">💾️</span>
    <h1>Offline Survival AI for Preppers</h1>
  </div>

  <div class="header-modes">
    <button id="modeLLM" class="mode-btn active"></button>
    <button id="modeAgents" class="mode-btn"></button>
    <button id="modeWiki" class="mode-btn"></button>	<!-- 🌐 -->
  </div>

  <div class="actions-right">
    <div class="lang-switch" aria-label="Language">
      <button class="flag" data-lang="en" title="English" aria-label="English">
        <img class="flag-icon" src="./flags/gb.svg" alt="" onerror="this.replaceWith(document.createTextNode('🇬🇧'))">
      </button>
      <button class="flag" data-lang="es" title="Español" aria-label="Español">
        <img class="flag-icon" src="./flags/es.svg" alt="" onerror="this.replaceWith(document.createTextNode('🇪🇸'))">
      </button>
      <button class="flag" data-lang="fr" title="Français" aria-label="Français">
        <img class="flag-icon" src="./flags/fr.svg" alt="" onerror="this.replaceWith(document.createTextNode('🇫🇷'))">
      </button>
    </div>
  </div>
</header>

<main class="main-area">
  <!-- Contenedor de Chat & Agentes -->
  <section id="chatContainer">
    <div class="chat-wrap">

      <!-- Selector de agentes (Step 0/1/2) -->
      <div id="agentsSteps" class="hidden">
        <div class="agent-steps">
          <!-- Step 0: elegir categoría -->
          <section id="step0" class="step hidden">
            <h3 id="step0Title"></h3>
            <div id="categoriesGrid" class="categories-grid"><!-- categorías --></div>
          </section>

<!-- Step 1: lista de agentes con filtros -->
<div class="step" id="step1">
  <h3 id="step1Title"></h3>
  <div class="step-toolbar">
    <!-- Barra de filtros por categorías (chips) -->
    <div id="catFilters" class="filter-chips"></div>
  </div>
  <div id="agentsGrid" class="agents-grid"><!-- cards de agentes --></div>
</div>

          <!-- Step 2: ficha del agente -->
          <div class="step hidden" id="step2">
            <h3></h3>
            <div id="agentPreview" class="agent-preview">
              <!-- Preview of selected agent -->
            </div>
            <div class="step-actions">
              <button id="backToList" class="ghost"></button>
              <button id="confirmAgent" class="primary"></button>
            </div>
          </div>
        </div>
      </div>

      <!-- Vista del chat -->
      <div id="chatView">
        <div class="chat-header">
          <!-- Avatar left -->
          <div id="chatAvatar" class="chat-avatar hidden">🤖</div>

          <!-- Centered title + tags -->
          <div class="chat-center">
            <h3 id="chatTitle" class="chat-title"></h3>
            <div class="tags">
			  <span id="activeModelTag" class="tag"></span>
			  <span id="currentModeTag" class="tag"></span>
			  <span id="activeAgentTag" class="tag hidden"></span>
			  <span id="activeProfessionTag" class="tag hidden"></span> <!-- NUEVA -->
			</div>
          </div>
		  <button id="selectAgentBtn" class="chat-header-btn hidden"></button>
        </div>

        <div id="chat" class="chat">
          <!-- Messages -->
        </div>

        <div class="composer">
          <textarea id="input" rows="2" placeholder=""></textarea>
          <button id="send" class="send" title="">✉️</button>
        </div>

        <div class="meta">
          <span id="latency">⏱️ —</span>
          <span id="tokenEst">📊 —</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Contenedor de Wikipedia -->
  <section id="wikiView" class="hidden">
    <iframe id="wikiFrame" src="" ></iframe>
  </section>

</main>

<footer class="app-footer">
  <div class="battery">
    <span>🔋</span>
    <div class="battery-bar"><div id="batteryFill"></div></div>
    <span id="batteryPct">—</span>
  </div>

  <!-- Idioma detectado -->
  <div class="lang">
    <span id="langName"></span>
  </div>

  <div class="footer-tools">
    <button id="resetChat" class="ghost"></button>
    <button id="themeToggle" class="ghost"></button>
  </div>
</footer>

<script src="./script.js"></script>
</body>
</html>
